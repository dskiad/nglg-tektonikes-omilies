name: Update Library Presentation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-governance-frame.yml'
      - 'scripts/update_library_presentation.py'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update page
        run: python3 scripts/update_library_presentation.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add Grand Master portrait to library header"
            git push
          fi
