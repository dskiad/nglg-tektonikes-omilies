name: Add Governance Shelf Frame

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-governance-frame.yml'

permissions:
  contents: write

jobs:
  update-shelf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add framed building image to Governance shelf
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = "  .candelabrum img{display:block; width:100%; height:auto;}\n"
          css = r'''

  /* ---------- Κάδρο στο ράφι Governance and Structure ---------- */
  .governance-frame{
    flex:0 0 auto;
    align-self:flex-end;
    width:min(205px, 24vw);
    margin:0 8px 0 20px;
    transform:rotate(-0.5deg) translateY(2px);
    transform-origin:bottom center;
    filter:
      drop-shadow(0 14px 16px rgba(0,0,0,0.62))
      drop-shadow(0 0 10px rgba(201,162,75,0.12));
    pointer-events:none;
  }
  .governance-frame img{
    display:block;
    width:100%;
    height:auto;
    border-radius:2px;
  }
  @media (max-width:900px){
    .governance-frame{width:170px; margin-left:10px;}
  }
'''

          if '.governance-frame{' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_anchor + css, 1)

          label = '        <div class="shelf-label"><span class="lead">Governance</span><span>and Structure</span></div>'
          frame = '''        <div class="governance-frame">\n          <img src="assets/governance-frame.jpg" width="520" height="633" alt="Εθνική Μεγάλη Στοά της Ελλάδος" decoding="async">\n        </div>\n'''

          if 'src="assets/governance-frame.jpg"' not in s:
              if label not in s:
                  raise SystemExit('Governance shelf label not found')
              s = s.replace(label, frame + label, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Display framed building image on Governance shelf"
            git push
          fi
